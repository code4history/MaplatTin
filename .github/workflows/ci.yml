name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  test-node:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（m1-t1）。
          # pnpm 11 は package.json の pnpm フィールドを読まないため、
          # overrides は m1-t2 で不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          
      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する（m1-t2）
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install
        
      - name: Run lint
        run: pnpm run lint
        
      - name: Run type check
        run: pnpm run typecheck
        
      - name: Run tests
        run: pnpm test
        
      - name: Build
        run: pnpm run build

      # 追跡している dist/ が、この commit のソースから build したものと一致するかを検査する（MaplatTin#49）。
      # dist は outer の workspace で兄弟が Tin を解決するときに使うため追跡している。
      # 検査は dist/ に絞る: 上の「Apply CI-only pnpm config」が未追跡の pnpm-workspace.yaml を作るため、
      # 絞りを外すと常に失敗する
      - name: Check tracked dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "::error::追跡している dist/ がソースと一致しません。standalone の clone で cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml && pnpm install --frozen-lockfile && pnpm run build を実行し、dist/ を同じ commit に含めてください（outer の workspace で build した dist は CI と一致しません）"
            exit 1
          fi
